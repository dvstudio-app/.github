name: Bug report
description: Something in VoiceWink does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Do not paste log files, your license key, or screenshots with personal data.
        For those, use **About → Report a problem** in the app, or email support@dvstudio.app.
  - type: input
    id: version
    attributes:
      label: VoiceWink version
      description: Shown on the About page in the app.
      placeholder: 1.87.382
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The steps you took, what you expected, and what you saw instead.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no log file, license key, API key, or personal data.
          required: true
